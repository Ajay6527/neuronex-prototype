<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASHA Companion – Offline Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9F0EE;--card:#fff;--ink:#12292A;--mut:#5A7273;--pri:#0B5D5B;--onpri:#fff;--line:#CFDDDA;--red:#C62828;--redbg:#FDECEA;--amb:#9A6200;--ambbg:#FFF4D9;--ok:#1B7A43;--okbg:#E4F5EA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1A1A;--card:#142626;--ink:#E3F0EE;--mut:#93ADAA;--pri:#4FC1B8;--onpri:#06211F;--line:#26403F;--red:#FF8A80;--redbg:#3A1A18;--amb:#FFC965;--ambbg:#3A2C10;--ok:#6FD79A;--okbg:#12301F}}
:root[data-theme="dark"]{--bg:#0C1A1A;--card:#142626;--ink:#E3F0EE;--mut:#93ADAA;--pri:#4FC1B8;--onpri:#06211F;--line:#26403F;--red:#FF8A80;--redbg:#3A1A18;--amb:#FFC965;--ambbg:#3A2C10;--ok:#6FD79A;--okbg:#12301F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible","Noto Sans Telugu",system-ui,sans-serif;display:flex;justify-content:center;min-height:100vh}
.phone{width:100%;max-width:420px;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
header{background:var(--pri);color:var(--onpri);padding:14px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;line-height:1.2}
header small{display:block;font-weight:400;opacity:.85;font-size:12px}
.pill{border:1px solid currentColor;background:transparent;color:inherit;border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.net{padding:6px 16px;font-size:13px;display:flex;gap:8px;align-items:center;background:var(--okbg);color:var(--ok)}
.net.off{background:var(--ambbg);color:var(--amb)}
.net b{flex:1;font-weight:700}
main{flex:1;padding:14px 16px;overflow-y:auto}
.tab{display:none}.tab.on{display:block}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);position:sticky;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:12px 4px;font:inherit;font-size:14px;cursor:pointer}
nav button[aria-selected=true]{color:var(--pri);font-weight:700;box-shadow:inset 0 3px 0 var(--pri)}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;text-align:left}
.chip.danger{border-color:var(--red);color:var(--red)}
.msg{margin:10px 0;padding:10px 12px;border-radius:12px;max-width:92%}
.q{background:var(--pri);color:var(--onpri);margin-left:auto;border-bottom-right-radius:3px}
.a{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:3px}
.a .cite{margin-top:8px;font-size:13px;color:var(--mut);border-top:1px dashed var(--line);padding-top:6px}
.a .meta{font-size:12px;color:var(--mut);margin-top:2px}
.a.esc{background:var(--redbg);border:2px solid var(--red)}
.a.esc h3{margin:0 0 4px;color:var(--red);font-size:17px}
.a.ref{background:var(--ambbg);border-color:var(--amb)}
.a.ref h3{margin:0 0 4px;color:var(--amb);font-size:16px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px;margin-bottom:6px}
.tag.rule{background:var(--red);color:var(--card)}
.tag.rag{background:var(--okbg);color:var(--ok)}
.ask{display:flex;gap:8px;margin-top:12px}
.ask input{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.ask button{border:0;background:var(--pri);color:var(--onpri);border-radius:10px;padding:0 16px;font:inherit;font-weight:700;cursor:pointer}
.hh{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.hh.p1{border-left-color:var(--red)}.hh.p2{border-left-color:var(--amb)}.hh.p3{border-left-color:var(--ok)}
.hh h4{margin:0;font-size:16px}.hh p{margin:2px 0 8px;color:var(--mut);font-size:14px}
.hh .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hh .done{background:var(--pri);color:var(--onpri);border:0;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.hh.fin{opacity:.55}.hh.fin .done{display:none}
.sync{background:var(--ambbg);color:var(--amb);padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:14px}
.sync.ok{background:var(--okbg);color:var(--ok)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font-size:24px;color:var(--pri)}
.stat span{font-size:13px;color:var(--mut)}
.note{font-size:13px;color:var(--mut);margin-top:12px}
h2{font-size:17px;margin:0 0 10px}
@media (prefers-reduced-motion:no-preference){.msg{animation:pop .25s ease-out}@keyframes pop{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<div class="phone">
<header>
  <h1>ASHA Companion<small id="sub"></small></h1>
  <button class="pill" id="lang">తెలుగు</button>
</header>
<div class="net" id="net"><b id="netTxt"></b><button class="pill" id="netBtn"></button></div>
<main>
<section class="tab on" id="t-ask">
  <div class="chips" id="chips"></div>
  <div id="chat"></div>
  <div class="ask"><input id="inp" aria-label="Question" autocomplete="off"><button id="go"></button></div>
</section>
<section class="tab" id="t-visit">
  <h2 id="vTitle"></h2>
  <div class="sync" id="sync"></div>
  <div id="visits"></div>
</section>
<section class="tab" id="t-dev">
  <h2 id="dTitle"></h2>
  <div class="grid">
    <div class="stat"><b>~120 MB</b><span id="d1"></span></div>
    <div class="stat"><b>~350 MB</b><span id="d2"></span></div>
    <div class="stat"><b>~1.8 s</b><span id="d3"></span></div>
    <div class="stat"><b id="live">–</b><span id="d4"></span></div>
  </div>
  <p class="note" id="dNote"></p>
</section>
</main>
<nav role="tablist">
  <button role="tab" aria-selected="true" data-t="ask" id="n-ask"></button>
  <button role="tab" aria-selected="false" data-t="visit" id="n-visit"></button>
  <button role="tab" aria-selected="false" data-t="dev" id="n-dev"></button>
</nav>
</div>
<script>
var L='en',online=true,queue=0;
var UI={en:{sub:"Protocol answers, even with no signal",ask:"Ask",visit:"Visits",dev:"Device",ph:"Type your question…",on:"Online",off:"Offline mode: all answers come from this phone",goOff:"Go offline",goOn:"Go online",vT:"Today's visit list",dT:"On-device footprint",d1:"Model + embeddings",d2:"Peak RAM",d3:"Answer time, CPU only",d4:"Rule check (this demo)",dN:"Sample values for the video. Replace them with the numbers you measure on your device.",done:"Mark done",rule:"Danger-sign rule",rag:"From protocol",refer:"Refer immediately",out:"Outside my scope",nomatch:"I could not find this in the protocols. Please ask a doctor or your ANM supervisor.",pend:"visits saved on phone, will sync when online",synced:"All visits synced",ms:"answered in"},
te:{sub:"సిగ్నల్ లేకపోయినా ప్రోటోకాల్ సమాధానాలు",ask:"అడగండి",visit:"సందర్శనలు",dev:"పరికరం",ph:"మీ ప్రశ్న టైప్ చేయండి…",on:"ఆన్‌లైన్",off:"ఆఫ్‌లైన్ మోడ్: సమాధానాలన్నీ ఈ ఫోన్ నుండే",goOff:"ఆఫ్‌లైన్ చేయండి",goOn:"ఆన్‌లైన్ చేయండి",vT:"ఈరోజు సందర్శన జాబితా",dT:"ఫోన్‌లో వినియోగం",d1:"మోడల్ + ఎంబెడ్డింగ్స్",d2:"గరిష్ట RAM",d3:"సమాధాన సమయం, CPU మాత్రమే",d4:"నియమ తనిఖీ (ఈ డెమో)",dN:"వీడియో కోసం నమూనా విలువలు. మీ పరికరంలో కొలిచిన విలువలతో మార్చండి.",done:"పూర్తి",rule:"ప్రమాద సంకేత నియమం",rag:"ప్రోటోకాల్ నుండి",refer:"వెంటనే రెఫర్ చేయండి",out:"నా పరిధికి వెలుపల",nomatch:"ఇది ప్రోటోకాల్స్‌లో కనబడలేదు. దయచేసి వైద్యుడిని లేదా ANM సూపర్వైజర్‌ను అడగండి.",pend:"సందర్శనలు ఫోన్‌లో భద్రం, ఆన్‌లైన్ అయినప్పుడు సింక్ అవుతాయి",synced:"అన్నీ సింక్ అయ్యాయి",ms:"సమాధాన సమయం"}};
var KB=[
{k:["ors","oral rehydration","loose motion","diarrh","ఓఆర్ఎస్","విరేచన"],c:"ORS & Fever Management §3.2",
 en:"Mix 1 ORS packet in 1 litre of clean water. After each loose stool give 50–100 ml to children under 2 years and 100–200 ml to children 2–10 years. Discard leftover solution after 24 hours.",
 te:"1 ORS ప్యాకెట్‌ను 1 లీటర్ శుభ్రమైన నీటిలో కలపండి. ప్రతి విరేచనం తర్వాత 2 ఏళ్ల లోపు పిల్లలకు 50–100 మి.లీ, 2–10 ఏళ్ల వారికి 100–200 మి.లీ ఇవ్వండి. 24 గంటల తర్వాత మిగిలిన ద్రావణాన్ని పారబోయండి."},
{k:["anc","checkup","antenatal","ఏఎన్సీ","తనిఖీ"],c:"Antenatal Care Schedule §1.1",
 en:"Minimum 4 ANC visits: 1st within 12 weeks, 2nd between 14–26 weeks, 3rd between 28–34 weeks, 4th from 36 weeks until delivery.",
 te:"కనీసం 4 ANC సందర్శనలు: 1వది 12 వారాల లోపు, 2వది 14–26 వారాల మధ్య, 3వది 28–34 వారాల మధ్య, 4వది 36 వారాల నుండి ప్రసవం వరకు."},
{k:["bcg","vaccine","immunis","immuniz","టీకా","వ్యాక్సిన్"],c:"Immunisation Schedule §2",
 en:"At birth (within 24 hours): BCG, OPV-0, Hepatitis B. At 6 weeks: Penta-1, OPV-1, Rota-1, fIPV-1, PCV-1.",
 te:"పుట్టిన 24 గంటల్లో: BCG, OPV-0, హెపటైటిస్ B. 6 వారాల వద్ద: పెంటా-1, OPV-1, రోటా-1, fIPV-1, PCV-1."},
{k:["bp","blood pressure","hypertension","రక్తపోటు","బీపీ"],c:"Hypertension & Diabetes Follow-up §4.1",
 en:"If BP is 140/90 or higher on two separate readings, refer to the PHC. Re-check at every visit and advise salt reduction.",
 te:"రెండు వేర్వేరు రీడింగ్‌లలో BP 140/90 లేదా అంతకంటే ఎక్కువ ఉంటే PHCకి రెఫర్ చేయండి. ప్రతి సందర్శనలో మళ్లీ చూసి ఉప్పు తగ్గించమని చెప్పండి."}];
var ESC=[
{k:["bleeding","bleed","రక్తస్రావం","బ్లీడింగ్"],c:"Danger Signs in Pregnancy §1.2",
 en:"Bleeding during pregnancy is a danger sign. Refer now to the nearest FRU/hospital. Call 108.",
 te:"గర్భిణీకి రక్తస్రావం ప్రమాద సంకేతం. వెంటనే సమీప FRU/ఆసుపత్రికి రెఫర్ చేయండి. 108కి కాల్ చేయండి."},
{k:["fits","convulsion","seizure","ఫిట్స్","మూర్ఛ"],c:"Danger Signs §1.4",
 en:"Convulsions are a danger sign. Keep the person on their side, put nothing in the mouth, and refer immediately. Call 108.",
 te:"ఫిట్స్ ప్రమాద సంకేతం. పక్కకు తిప్పి పడుకోబెట్టండి, నోట్లో ఏమీ పెట్టకండి, వెంటనే రెఫర్ చేయండి. 108కి కాల్ చేయండి."},
{k:["not feeding","not breathing","పాలు తాగడం లేదు"],c:"Newborn Danger Signs §2.1",
 en:"A newborn who is not feeding or not breathing well has a danger sign. Refer immediately to the nearest facility.",
 te:"పాలు తాగని లేదా సరిగా ఊపిరి తీసుకోని నవజాత శిశువు ప్రమాద సంకేతం. వెంటనే సమీప ఆసుపత్రికి రెఫర్ చేయండి."}];
var OOS=["dose","dosage","antibiotic","tablet","మోతాదు","యాంటీబయాటిక్","మాత్ర"];
var CHIPS={en:[["How to make ORS?"],["When are ANC checkups due?"],["Vaccines at 6 weeks?"],["Pregnant woman bleeding at 8 months",1],["What dose of this antibiotic?"]],
te:[["ORS ఎలా కలపాలి?"],["ANC తనిఖీలు ఎప్పుడు?"],["6 వారాల టీకాలు ఏవి?"],["8 నెలల గర్భిణీకి బ్లీడింగ్ అవుతోంది",1],["ఈ యాంటీబయాటిక్ మోతాదు ఎంత?"]]};
var HH=[
{n:{en:"Lakshmi, 8 months pregnant",te:"లక్ష్మి, 8 నెలల గర్భిణీ"},v:"Rampur",t:{en:"4th ANC due now, BP check",te:"4వ ANC ఇప్పుడు, BP తనిఖీ"},p:1,d:0},
{n:{en:"Baby of Sunita, 6 weeks",te:"సునీత శిశువు, 6 వారాలు"},v:"Rampur",t:{en:"Penta-1, OPV-1, Rota-1 overdue 3 days",te:"పెంటా-1, OPV-1, రోటా-1, 3 రోజులు ఆలస్యం"},p:1,d:0},
{n:{en:"Ramesh, 52, hypertension",te:"రమేష్, 52, రక్తపోటు"},v:"Kothapalli",t:{en:"BP follow-up, last BP 150/96",te:"BP ఫాలోఅప్, చివరి BP 150/96"},p:2,d:0},
{n:{en:"Baby of Anitha, 9 months",te:"అనిత శిశువు, 9 నెలలు"},v:"Kothapalli",t:{en:"Measles dose due this week",te:"ఈ వారం మీజిల్స్ డోసు"},p:2,d:0},
{n:{en:"Padma, 5 months pregnant",te:"పద్మ, 5 నెలల గర్భిణీ"},v:"Rampur",t:{en:"2nd ANC window open, 12 days left",te:"2వ ANC సమయం, 12 రోజులు మిగిలాయి"},p:3,d:0}];
var $=function(i){return document.getElementById(i)};
function t(k){return UI[L][k]}
function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function has(q,arr){return arr.some(function(w){return q.indexOf(w)>-1})}
function add(cls,html){var d=document.createElement("div");d.className="msg "+cls;d.innerHTML=html;$("chat").appendChild(d);d.scrollIntoView({block:"nearest"})}
function ask(q){
  q=q.trim();if(!q)return;add("q",esc(q));
  var s=performance.now(),lq=q.toLowerCase(),i,e,ms;
  for(i=0;i<ESC.length;i++){e=ESC[i];if(has(lq,e.k)){ms=(performance.now()-s).toFixed(1);$("live").textContent=ms+" ms";
    add("a esc","<span class='tag rule'>"+t("rule")+"</span><h3>"+t("refer")+"</h3>"+e[L]+"<div class='cite'>"+e.c+"</div><div class='meta'>"+t("ms")+" "+ms+" ms</div>");return}}
  if(has(lq,OOS)){add("a ref","<h3>"+t("out")+"</h3>"+(L=="en"?"Antibiotic doses must be decided by a doctor. Please contact the PHC medical officer.":"యాంటీబయాటిక్ మోతాదును వైద్యుడే నిర్ణయించాలి. దయచేసి PHC వైద్యాధికారిని సంప్రదించండి.")+"<div class='cite'>Scope Policy §0</div>");return}
  for(i=0;i<KB.length;i++){e=KB[i];if(has(lq,e.k)){setTimeout(function(e){return function(){add("a","<span class='tag rag'>"+t("rag")+"</span><br>"+e[L]+"<div class='cite'>"+e.c+"</div><div class='meta'>"+(online?"":"offline · ")+t("ms")+" ~1.8 s</div>")}}(e),700);return}}
  add("a ref",t("nomatch"));
}
function chips(){$("chips").innerHTML="";CHIPS[L].forEach(function(c){var b=document.createElement("button");b.className="chip"+(c[1]?" danger":"");b.textContent=c[0];b.onclick=function(){ask(c[0])};$("chips").appendChild(b)})}
function visits(){
  var pr=["","P1","P2","P3"];$("visits").innerHTML="";
  HH.forEach(function(h){var d=document.createElement("div");d.className="hh p"+h.p+(h.d?" fin":"");
    d.innerHTML="<div class='row'><h4>"+h.n[L]+"</h4><span>"+pr[h.p]+"</span></div><p>"+h.v+" · "+h.t[L]+"</p><button class='done'>"+t("done")+"</button>";
    d.querySelector(".done").onclick=function(){h.d=1;if(!online)queue++;visits()};$("visits").appendChild(d)});
  var s=$("sync");if(queue){s.className="sync";s.textContent=queue+" "+t("pend")}else{s.className="sync ok";s.textContent=t("synced")}
}
function net(){var n=$("net");n.className="net"+(online?"":" off");$("netTxt").textContent=online?t("on"):t("off");$("netBtn").textContent=online?t("goOff"):t("goOn")}
function ui(){
  $("sub").textContent=t("sub");$("inp").placeholder=t("ph");$("go").textContent=t("ask");
  $("n-ask").textContent=t("ask");$("n-visit").textContent=t("visit");$("n-dev").textContent=t("dev");
  $("vTitle").textContent=t("vT");$("dTitle").textContent=t("dT");
  ["d1","d2","d3","d4"].forEach(function(k){$(k).textContent=t(k)});$("dNote").textContent=t("dN");
  $("lang").textContent=L=="en"?"తెలుగు":"English";document.documentElement.lang=L;chips();visits();net();
}
$("lang").onclick=function(){L=L=="en"?"te":"en";ui()};
$("netBtn").onclick=function(){online=!online;if(online)queue=0;net();visits()};
